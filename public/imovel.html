<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Imóvel · RUAH</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap{max-width:980px;margin:0 auto;padding:24px 16px 60px;display:grid;gap:18px}
  .hero{cursor:zoom-in;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--line);display:block}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .thumbs img{width:110px;height:76px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;flex:none}
  .thumbs img.on{border-color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Carregando…</p></div>
<script src="/galeria.js"></script>
<script src="/imovel.js"></script>
</body>
</html>
